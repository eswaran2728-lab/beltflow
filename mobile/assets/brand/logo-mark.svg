<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 100 1024 1024">
  <!-- BeltFlow mark: a tied belt with depth. Gold band, white knot, two tails. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F2941C"/>
    </linearGradient>
    <linearGradient id="goldDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2941C"/>
      <stop offset="1" stop-color="#D0760A"/>
    </linearGradient>
    <linearGradient id="knot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E9F2"/>
    </linearGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="512" cy="900" rx="250" ry="22" fill="#000000" opacity="0.22"/>
  <!-- tails: thickness, then face -->
  <path d="M436 546 L548 546 L420 864 Q412 884 392 876 L318 848 Q298 840 306 820 Z" fill="#8F4F05"/>
  <path d="M476 546 L588 546 L718 820 Q726 840 706 848 L632 876 Q612 884 604 864 Z" fill="#A85F07"/>
  <path d="M436 520 L548 520 L420 838 Q412 858 392 850 L318 822 Q298 814 306 794 Z" fill="url(#goldDeep)"/>
  <path d="M476 520 L588 520 L718 794 Q726 814 706 822 L632 850 Q612 858 604 838 Z" fill="url(#gold)"/>
  <!-- band: thickness, face, highlight -->
  <rect x="112" y="412" width="800" height="124" rx="30" fill="#A85F07"/>
  <rect x="112" y="386" width="800" height="124" rx="30" fill="url(#gold)"/>
  <rect x="140" y="398" width="744" height="22" rx="11" fill="#FFFFFF" opacity="0.38"/>
  <!-- knot: thickness, face, fold -->
  <rect x="396" y="374" width="232" height="204" rx="44" fill="#A9B6C9"/>
  <rect x="396" y="346" width="232" height="204" rx="44" fill="url(#knot)"/>
  <path d="M452 346 L512 346 L452 550 L440 550 Q396 550 396 506 L396 470 Z" fill="#D5DDE9"/>
</svg>

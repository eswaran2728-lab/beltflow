name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      - name: Restore or Generate Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          elif [ -f "release.keystore.base64" ]; then
            base64 -d release.keystore.base64 > release.keystore
          else
            echo "Generating self-signed release keystore for CI build..."
            keytool -genkeypair -v -keystore release.keystore -storepass beltflowpass -alias beltflow -keypass beltflowpass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BeltFlow, OU=BeltFlow, O=BeltFlow, L=Sepang, ST=Selangor, C=MY"
          fi
          keytool -list -keystore release.keystore -storepass beltflowpass -alias beltflow

      - name: Build Android App Bundle (Release AAB)
        env:
          KEYSTORE_PASSWORD: beltflowpass
          KEY_ALIAS: beltflow
          KEY_PASSWORD: beltflowpass
        run: gradle :app:bundleRelease --stacktrace --info

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: beltflowpass
          KEY_ALIAS: beltflow
          KEY_PASSWORD: beltflowpass
        run: gradle :app:assembleRelease --stacktrace --info

      - name: Verify Signed Bundle
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab || echo "Bundle verification completed"

      - name: Upload Release AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk


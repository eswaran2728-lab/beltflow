name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias beltflow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass beltflowpass \
            -keypass beltflowpass \
            -dname "CN=BeltFlow Academy, OU=Production, O=BeltFlow, L=San Francisco, ST=California, C=US"

      - name: Build Android App Bundle (Release AAB) & APK
        env:
          KEYSTORE_PASSWORD: beltflowpass
          KEY_ALIAS: beltflow
          KEY_PASSWORD: beltflowpass
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify Signed Bundle
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab || echo "Bundle verification completed"

      - name: Upload Release AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

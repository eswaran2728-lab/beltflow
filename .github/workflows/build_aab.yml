name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on every branch/PR. Never touches signing secrets, so it is safe
  # to run against untrusted branches/forks.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Compile Release Sources (no signing)
        run: ./gradlew compileReleaseKotlin --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Produces a signed release AAB/APK. Only runs on main, and only signs
  # when the real production keystore secrets are configured - it never
  # falls back to a locally generated keystore, since a "release" build
  # signed with a throwaway key is not a real release and must not be
  # mistaken for one (e.g. accidentally uploaded to Play Console).
  release-signing:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify signing secrets are configured
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::warning::Release signing secrets are not configured (RELEASE_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD). Skipping signed release build - this is expected until production signing is set up."
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        if: env.SIGNING_READY == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: env.SIGNING_READY == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      - name: Restore Release Keystore From Secret
        if: env.SIGNING_READY == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Signed Release App Bundle and APK
        if: env.SIGNING_READY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify Signed Bundle
        if: env.SIGNING_READY == 'true'
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release AAB (For Google Play Console)
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

name: Build BeltFlow Play Store bundle (AAB)

# Builds the production Android App Bundle for Google Play from mobile/.
#
# Run it by hand: Actions > "Build BeltFlow Play Store bundle (AAB)" > Run
# workflow. It never uploads anything to Google Play; you upload the bundle
# in Play Console yourself.
#
# Signing uses the NEW upload key, stored only as GitHub secrets:
#   PLAY_UPLOAD_KEYSTORE_BASE64, PLAY_UPLOAD_KEYSTORE_PASSWORD,
#   PLAY_UPLOAD_KEY_ALIAS, PLAY_UPLOAD_KEY_PASSWORD
# (The old RELEASE_KEYSTORE_* key is public in git history and must never
# be used again.) Without these secrets the run still builds, to check the
# pipeline, but the result is marked NOT FOR UPLOAD.
#
# See docs/release/PLAY_STORE_RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Production server address, https only (e.g. https://beltflow-api.onrender.com). Leave empty to use the repository variable BELTFLOW_API_URL."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: "1"
      # Never set EXPO_PUBLIC_BELTFLOW_TESTING_BUILD here: a production build
      # has no developer panel and only talks to an https server.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Production server address (https only)
        env:
          INPUT_URL: ${{ github.event.inputs.api_url }}
          VAR_URL: ${{ vars.BELTFLOW_API_URL }}
        run: |
          URL="${INPUT_URL:-$VAR_URL}"
          URL="${URL%/}"
          case "$URL" in
            https://*) ;;
            *) echo "::error::Set an https:// server address (input api_url or repository variable BELTFLOW_API_URL)."; exit 1 ;;
          esac
          echo "EXPO_PUBLIC_API_URL=$URL" >> "$GITHUB_ENV"
          echo "Server: $URL"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install dependencies
        run: npm ci

      - name: Type check and tests
        run: |
          npx tsc --noEmit -p .
          npx jest --silent

      - name: Version code for this upload
        # Every Play upload needs a higher version code. The older app on this
        # listing reached 16, so start well above it and count up per run.
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          node -e "const fs=require('fs');const p='app.json';const c=JSON.parse(fs.readFileSync(p));if(c.expo.android.package!=='com.eswaran.beltflow'){console.error('Unexpected app ID: '+c.expo.android.package);process.exit(1)}c.expo.android.versionCode=$CODE;fs.writeFileSync(p,JSON.stringify(c,null,2));"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Version code: $CODE, version name: $(node -p "require('./app.json').expo.version")"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Check production settings
        run: |
          # HTTPS only: plain-HTTP traffic must not be enabled.
          if grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml; then
            echo "::error::Plain-HTTP traffic is enabled in the manifest."; exit 1
          fi
          grep -q 'com.eswaran.beltflow' android/app/build.gradle

      - name: Prepare the upload key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload key secrets: building an UNSIGNED check build that cannot be uploaded to Google Play."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed bundle
        if: steps.key.outputs.signed == 'true'
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build check bundle (not for upload)
        if: steps.key.outputs.signed != 'true'
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Show the signing certificate
        # Compare this SHA-256 with the upload certificate shown in Play Console
        # (Test and release > App integrity). Public information, safe to print.
        working-directory: mobile/android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -E 'Owner|SHA256' || true

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Name the bundle
        run: |
          mkdir -p ../aab-out
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "../aab-out/beltflow-${VERSION_CODE}.aab"
          else
            cp android/app/build/outputs/bundle/release/app-release.aab "../aab-out/beltflow-${VERSION_CODE}-UNSIGNED-NOT-FOR-UPLOAD.aab"
          fi
          ls -l ../aab-out

      - name: Upload signed bundle
        if: steps.key.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beltflow-play-bundle-${{ env.VERSION_CODE }}
          path: aab-out/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload check bundle
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beltflow-check-bundle-NOT-FOR-UPLOAD-${{ env.VERSION_CODE }}
          path: aab-out/*.aab
          retention-days: 3
          if-no-files-found: error

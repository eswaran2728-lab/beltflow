name: Build BeltFlow v2.0 mobile APK (testing)

# Builds the Expo app in mobile/ into an installable Android APK for device
# testing (H27 NATIVE-001). The APK is signed with the standard debug key, so
# it is for testing only, never for the Play Store. Download it from the run's
# "Artifacts" section.
#
# Server address: set the repository variable BELTFLOW_API_URL, or type an
# address when running this workflow by hand. The app's login screen also lets
# you change the server address at runtime.

on:
  push:
    branches: [ "main", "feat/phase2-native-and-integration" ]
    paths: [ "mobile/**", ".github/workflows/mobile_apk.yml" ]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server address baked into the app, e.g. http://192.168.1.10:4000 (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || vars.BELTFLOW_API_URL || '' }}
      EXPO_NO_TELEMETRY: "1"
      # Testing APK only: keeps the developer panel (server address, synthetic
      # test accounts). Never set this for a production build.
      EXPO_PUBLIC_BELTFLOW_TESTING_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install dependencies
        run: npm ci

      - name: Type check and tests
        run: |
          npx tsc --noEmit -p .
          npx jest --silent

      - name: Use a separate app ID for the testing build
        # So a testing APK can be installed next to the Play Store app, and can
        # never be mistaken for (or replace) it.
        run: |
          node -e "const fs=require('fs');const p='app.json';const c=JSON.parse(fs.readFileSync(p));c.expo.android.package='com.eswaran.beltflow.testing';c.expo.name='BeltFlow (testing)';fs.writeFileSync(p,JSON.stringify(c,null,2));"
          grep -q 'com.eswaran.beltflow.testing' app.json

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Allow plain-HTTP test servers (testing build only)
        # Production builds keep Android's default (HTTPS only).
        run: |
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p ../apk-out
          cp android/app/build/outputs/apk/release/app-release.apk "../apk-out/beltflow-v2.0-testing-${GITHUB_SHA::7}.apk"
          sha256sum ../apk-out/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beltflow-v2.0-testing-apk
          path: apk-out/*.apk
          retention-days: 30

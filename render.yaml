# Render Blueprint for BeltFlow (https://render.com/docs/blueprint-spec).
#
# Creates, in the Singapore region (closest to Malaysia):
#   - beltflow-api: the server in Docker, with a disk for uploaded videos
#   - beltflow-db:  managed PostgreSQL
#
# Every secret is generated by Render on first creation and never appears in
# this file or in git. After the first deploy:
#   1. Set CORS_ALLOWED_ORIGINS (marked sync: false) in the Render dashboard.
#   2. Copy BELTFLOW_SETUP_TOKEN from the dashboard, open the site, and create
#      the first Super Admin with it. See docs/release/PLAY_STORE_RELEASE.md.
#
# Check the plan names and the region in the dashboard when you apply this
# Blueprint; Render shows any field it does not accept.

databases:
  - name: beltflow-db
    databaseName: beltflow
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
    # No outside access: only Render services on the private network connect.
    ipAllowList: []

services:
  - type: web
    name: beltflow-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    branch: main
    # Deploy on purpose, not on every push to main.
    autoDeploy: false
    healthCheckPath: /api/health/ready
    disk:
      name: beltflow-media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      # Render's proxy terminates HTTPS and adds X-Forwarded-For / -Proto.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: beltflow-db
          property: connectionString
      # The internal database address is on Render's private network, which
      # does not use TLS. The server allows this only for a private host.
      - key: DATABASE_SSL
        value: disable
      - key: MEDIA_STORAGE_DIR
        value: /var/data/media
      - key: JWT_SECRET
        generateValue: true
      - key: MEDIA_STORAGE_SECRET
        generateValue: true
      - key: QR_ED25519_PRIVATE_KEY_SEED
        generateValue: true
      - key: QR_ED25519_PREVIOUS_SEED
        generateValue: true
      - key: BELTFLOW_SETUP_TOKEN
        generateValue: true
      - key: BELTFLOW_WORKER_TOKEN
        generateValue: true
      # The exact https:// origin(s) of the web app, comma separated.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
